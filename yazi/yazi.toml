 [mgr]
ratio = [
	1, 3, 4
]
sort_by = "mtime"
sort_reverse = true
sort_dir_first = true
linemode = "size"

[opener]
play = [
	{ run = "mpv %s", block = true }
]
edit = [
	{ run = 'code-oss "$@"', block = true, for = "unix" }
]
open = [
	{ run = "xdg-open %s1", desc = "Open" },
]
[open]
rules = [
  { mime = "video/*", use = [ "play", "reveal" ] },
]